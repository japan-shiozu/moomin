const H={"クロットユール":"つばのある丸い帽子をかぶった、ひげのある人物。","ムーミンパパ":"背の高い黒いシルクハットがトレードマーク。冒険好きで、回想録を書く。","シュリュンケル博士":"白い柱の前に立つ、ひげ面の紳士。","スティンキー":"黒くて毛むくじゃらの生き物。ずるがしこくて、においがすごい。","ヘムレンおばさん":"体の大きいヘムレン族。頭に帽子、肩には布をかけている。","ニョロニョロ":"白くて細い、芽のような生き物の群れ。雷の夜に電気をあびるのが好き。","トゥーティッキ":"しましまのセーターを着た、物知りな女性。ランプと一緒にいる。","ミムラ夫人":"足元にたくさんの子どもたちがいる、子だくさんのお母さん。","ブリスク":"ペンギンたちといっしょに歩いている、とんがり帽子の人物。","スナフキン":"緑の帽子とコート。ハーモニカを吹く、釣り好きの旅人。","スノークのおじょうさん":"前髪と花冠がチャームポイント。ムーミンのとても仲良し。","リトルミイ":"頭の上のおだんご髪。小さいけれど勇敢で口が悪い。","ムーミントロール":"白くて丸いカラダ。花を持った、優しくて好奇心いっぱいの主人公。","ウィムジー":"耳当てのついた帽子で、階段のそばにいる。","ガフサ":"ロッキングチェアに座って本を読んでいる。","ムーミンママ":"しましまのエプロンとハンドバッグ。ムーミン谷の優しいお母さん。","ブリマドンナ":"細長い顔で、おしゃれにすましている。","フィリヨンカ":"お茶の席についている、心配性できれい好きな人。","灯台守":"灯台で暮らす、無口な人物。","ミムラねえさん":"花束を持った、恋多きで恋をしやすい。リトルミイのお姉さん。","ニブリング":"箱の中にちょこんと座っている。","セドリック":"黄色いマフラーが目印。スノークのおじょうさんの宝物のぶらぐるみ。","海賊":"眼帯をつけている。花と一緒に描かれている。","エドワード":"大きな灰色の体に三日月が見える。","スニフ":"大きな耳と小さな体。臆病だけど宝物が大好き。","ソプス":"赤いものの上にペンギンのような鳥がのっている。","エメラルド":"丸い体にしましま模様が見える。","小さな虫":"灰色の体にひげのような模様。名前は小さいけど絵は大きい。"};
function fireworks(){const c=document.createElement('canvas');c.id='fw';c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:98';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');let ps=[],t=0;function burst(){const px=Math.random()*c.width*.8+c.width*.1,py=Math.random()*c.height*.45+c.height*.1,col='hsl('+Math.floor(Math.random()*360)+',100%,55%)';for(let k=0;k<60;k++){const an=Math.PI*2*k/60,sp=2+Math.random()*3;ps.push({x:px,y:py,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:60,col})}}function loop(){if(document.getElementById('fw')!==c)return;x.clearRect(0,0,c.width,c.height);if(t++%35===0)burst();ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.99;p.l--;x.globalAlpha=p.l/60;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,2.5,0,7);x.fill()});x.globalAlpha=1;requestAnimationFrame(loop)}loop()}
